[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tapix-ai"
version = "0.1.0"
description = "Official Python client for the Tapix AI OpenAI-compatible API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tapix AI" }]
dependencies = ["openai>=1.0"]
keywords = ["llm", "openai", "api", "claude", "gpt", "gemini"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://tapixai.com"
Documentation = "https://tapixai.com/docs"
